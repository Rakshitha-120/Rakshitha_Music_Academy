<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Register | Moukthika Music Academy</title><link rel="stylesheet" href="css/style.css"></head><body class="auth-body">
<div class="auth-card wide"><a class="logo" href="index.html">MOUKTHIKA<span>♪</span></a><p class="eyebrow">START YOUR JOURNEY</p><h1>Create Student Account</h1><form onsubmit="registerStudent(event)"><div class="form-row"><label>Full Name<input id="regName" required></label><label>Email<input id="regEmail" type="email" required></label></div><div class="form-row"><label>Phone<input id="regPhone" required></label><label>Course<select id="regCourse" required><option value="">Choose course</option><option>Vocal Training</option><option>Keyboard & Piano</option><option>Guitar</option><option>Drums & Rhythm</option><option>Music Theory</option></select></label></div><div class="form-row"><label>Password<input id="regPassword" type="password" minlength="6" required></label><label>Age<input id="regAge" type="number" min="5" max="80" required></label></div><button class="btn full" type="submit">Register</button><p id="registerMsg" class="success"></p></form><p class="center">Already registered? <a href="login.html">Login</a></p></div><script src="js/script.js"></script></body></html>
